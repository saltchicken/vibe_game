<svg width="512" height="128" xmlns="http://www.w3.org/2000/svg">
  <!-- Frame 0: Idle/Neutral -->
  <g transform="translate(0,0)">
    <rect x="48" y="32" width="32" height="32" fill="#3498db" rx="8"/> <!-- Head -->
    <rect x="56" y="64" width="16" height="32" fill="#2ecc71"/> <!-- Body -->
    <rect x="48" y="96" width="12" height="32" fill="#e74c3c" rx="4"/> <!-- Left Leg -->
    <rect x="68" y="96" width="12" height="32" fill="#e74c3c" rx="4"/> <!-- Right Leg -->
  </g>
  <!-- Frame 1: Run Step 1 -->
  <g transform="translate(128,0)">
    <rect x="48" y="28" width="32" height="32" fill="#3498db" rx="8"/>
    <rect x="56" y="60" width="16" height="32" fill="#2ecc71"/>
    <rect x="40" y="92" width="12" height="24" fill="#e74c3c" rx="4"/> <!-- Leg back -->
    <rect x="76" y="92" width="12" height="24" fill="#e74c3c" rx="4"/> <!-- Leg forward -->
  </g>
  <!-- Frame 2: Mid-air / Passing -->
  <g transform="translate(256,0)">
    <rect x="48" y="24" width="32" height="32" fill="#3498db" rx="8"/>
    <rect x="56" y="56" width="16" height="32" fill="#2ecc71"/>
    <rect x="56" y="88" width="16" height="32" fill="#e74c3c" rx="4"/> <!-- Legs together -->
  </g>
  <!-- Frame 3: Run Step 2 -->
  <g transform="translate(384,0)">
    <rect x="48" y="28" width="32" height="32" fill="#3498db" rx="8"/>
    <rect x="56" y="60" width="16" height="32" fill="#2ecc71"/>
    <rect x="76" y="92" width="12" height="24" fill="#e74c3c" rx="4"/> <!-- Leg back -->
    <rect x="40" y="92" width="12" height="24" fill="#e74c3c" rx="4"/> <!-- Leg forward -->
  </g>
</svg>
